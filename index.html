<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema de Mapeamento</title>
<style>
:root{--bg1:#0b1220;--bg2:#13233f;--card:rgba(255,255,255,.07);--bd:rgba(255,255,255,.14);--tx:#eef3fb;--mut:#9fb0c9;--ac:#3b82f6;--ac2:#06b6d4;--err:#f87171;--ok:#34d399;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg1:#0b1220;--bg2:#13233f}}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);background:radial-gradient(1200px 600px at 80% -10%,#1d4ed8 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0891b2 0%,transparent 55%),linear-gradient(160deg,var(--bg1),var(--bg2))}
.wrap{min-height:100%;display:flex;flex-direction:column}
header{padding:20px 16px;text-align:center;border-bottom:1px solid var(--bd);background:rgba(255,255,255,.04);backdrop-filter:blur(8px)}
header h1{margin:0;font-size:clamp(1.3rem,4vw,2rem);letter-spacing:.12em;text-transform:uppercase;font-weight:700;background:linear-gradient(90deg,#fff,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{margin:4px 0 0;color:var(--mut);font-size:.85rem}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:400px;padding:32px 28px;border-radius:20px;background:var(--card);border:1px solid var(--bd);backdrop-filter:blur(14px);box-shadow:0 25px 60px rgba(0,0,0,.45)}
.logo{width:64px;height:64px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 10px 30px rgba(59,130,246,.45)}
.logo svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h2{text-align:center;margin:0 0 6px;font-size:1.25rem}
.sub{text-align:center;color:var(--mut);font-size:.9rem;margin:0 0 24px}
label{display:block;font-size:.8rem;color:var(--mut);margin:14px 0 6px}
.f{position:relative}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(0,0,0,.28);color:var(--tx);font-size:1rem;outline:none;transition:.2s}
input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(59,130,246,.3)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);cursor:pointer;padding:6px;font-size:.8rem}
.btn{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;font-size:1rem;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:.2s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:disabled{opacity:.7;cursor:wait;transform:none}
.msg{min-height:20px;margin-top:14px;text-align:center;font-size:.88rem}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
.msg a{color:#7dd3fc;font-weight:600}
.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
footer{padding:16px;text-align:center;color:var(--mut);font-size:.8rem;border-top:1px solid var(--bd);background:rgba(255,255,255,.04)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sistema de Mapeamento</h1>
    <p>Acesso restrito</p>
  </header>
  <main>
    <div class="card" id="card">
      <div class="logo"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
      <h2>Bem-vindo</h2>
      <p class="sub">Entre com seu login e senha</p>
      <div>
        <label for="u">Login</label>
        <div class="f"><input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Digite seu login"></div>
        <label for="p">Senha</label>
        <div class="f"><input id="p" type="password" autocomplete="current-password" placeholder="Digite sua senha"><button class="eye" id="eye" type="button">Mostrar</button></div>
        <button class="btn" id="go" type="button">Entrar</button>
        <div class="msg" id="msg" role="status" aria-live="polite"></div>
      </div>
    </div>
  </main>
  <footer>© Todos os direitos reservados a André Almeida</footer>
</div>
<script>
(function(){
  var URL_DESTINO="https://claude.ai/code/artifact/cbf1144c-87f2-401e-aa78-826d55a053ee";
  var LOGIN="entrar",SENHA="entrar";
  var u=document.getElementById("u"),p=document.getElementById("p"),go=document.getElementById("go"),
      msg=document.getElementById("msg"),card=document.getElementById("card"),eye=document.getElementById("eye");
  eye.addEventListener("click",function(){var s=p.type==="password";p.type=s?"text":"password";eye.textContent=s?"Ocultar":"Mostrar";});
  function show(t,c){msg.className="msg "+c;msg.textContent=t;}
  function abrir(){
    msg.className="msg ok";
    msg.innerHTML='Acesso liberado! Abrindo o sistema… Se não abrir, <a href="'+URL_DESTINO+'" target="_blank" rel="noopener">clique aqui</a>.';
    setTimeout(function(){
      try{window.top.location.href=URL_DESTINO;}
      catch(e){
        var w=null;try{w=window.open(URL_DESTINO,"_blank","noopener");}catch(e2){}
      }
    },600);
  }
  function entrar(){
    var lu=u.value.trim().toLowerCase(),lp=p.value;
    if(!lu||!lp){show("Preencha login e senha.","err");return;}
    go.disabled=true;
    if(lu===LOGIN&&lp===SENHA){abrir();setTimeout(function(){go.disabled=false;},2500);}
    else{
      show("Login ou senha incorretos.","err");
      card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");
      p.value="";go.disabled=false;p.focus();
    }
  }
  go.addEventListener("click",entrar);
  [u,p].forEach(function(el){el.addEventListener("keydown",function(e){if(e.key==="Enter")entrar();});});
})();
</script>
</body>
</html>
